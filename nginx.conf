server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # .webmanifest is not in nginx's default mime.types, so it was being served
    # as application/octet-stream. Chrome requires application/manifest+json to
    # treat the file as a manifest and fire beforeinstallprompt.
    #
    # NOTE: a `types { }` block inside `server` REPLACES the whole mime map
    # rather than appending, so it must be `types` at http level or use
    # `include mime.types` + a dedicated location. Safer: set the type on the
    # exact location only, leaving every other asset untouched.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json application/manifest+json image/svg+xml;
    gzip_min_length 1000;

    # Service worker must never be cached, or clients get stuck on an old
    # worker and never see updates. Same for the manifest and offline shell.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # Immutable hashed assets. Note: this regex deliberately excludes
    # webmanifest, sw.js, offline.html, index.html and the unhashed PWA icons,
    # which are handled by the exact-match blocks above or fall through to
    # the 1y regex below only when their filename is content-hashed.
    #
    # The PWA icons keep stable names (manifest references them), so they are
    # given a shorter cache to allow re-branding without stale icons.
    location ~* ^/(icon-(192|512)(-maskable)?|apple-touch-icon)\.png$ {
        add_header Cache-Control "public, max-age=604800" always;
        expires off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
