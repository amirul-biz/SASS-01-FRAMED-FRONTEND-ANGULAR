<div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
  <h2 class="font-headline-md text-headline-md text-primary mb-xs">Reset Password</h2>
  <p class="text-caption text-on-surface-variant mb-md">
    Reset link for <span class="font-label-md text-on-surface">{{ email() }}</span>. No email is sent
    automatically — copy the link and send it to the photographer.
  </p>

  @if (isResetting()) {
    <p class="text-body-md font-body-md text-on-surface-variant">Generating link...</p>
  } @else if (resetError()) {
    <p class="text-caption text-error">{{ resetError() }}</p>
  } @else if (resetLink(); as link) {
    <div class="link-row">
      <input
        type="text"
        readonly
        [value]="link"
        class="flex-1 min-w-0 h-10 px-md border border-outline-variant rounded-xl font-body-md text-body-md bg-surface text-on-surface-variant"
      />
      <button
        type="button"
        (click)="copy()"
        class="h-10 px-md border border-outline-variant rounded-xl font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors shrink-0"
      >
        {{ copied() ? 'Copied!' : 'Copy' }}
      </button>
    </div>
  }

  <div class="actions">
    <button
      type="button"
      (click)="close()"
      class="h-10 px-lg border border-outline-variant rounded-xl font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors"
    >
      Close
    </button>
  </div>
</div>
