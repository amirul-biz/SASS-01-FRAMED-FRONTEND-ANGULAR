<div class="flex flex-col gap-md">
  <p class="text-caption font-label-md text-on-surface-variant">Show photos captured between these times</p>

  <!-- Quick presets: most riders remember "morning" or "evening", not exact clock times -->
  <div class="flex flex-wrap gap-xs">
    @for (preset of presets; track preset.label) {
      <button
        type="button"
        class="h-8 px-md rounded-full border font-label-md text-label-md transition-colors"
        [class.border-primary]="isPresetActive(preset)"
        [class.bg-primary]="isPresetActive(preset)"
        [class.text-on-primary]="isPresetActive(preset)"
        [class.border-outline-variant]="!isPresetActive(preset)"
        [class.text-on-surface-variant]="!isPresetActive(preset)"
        [class.hover:bg-surface-container-low]="!isPresetActive(preset)"
        (click)="applyPreset(preset)"
      >
        {{ preset.label }}
      </button>
    }
  </div>

  <div class="flex items-end gap-sm">
    <div class="flex-1 flex flex-col gap-xs">
      <label class="text-caption text-on-surface-variant" for="time-from">From</label>
      <input
        id="time-from"
        type="time"
        class="w-full h-11 bg-surface rounded-[12px] border border-outline-variant px-md text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
        [value]="fromTime()"
        (change)="setFromTime($any($event.target).value)"
      />
    </div>
    <span class="material-symbols-outlined text-on-surface-variant pb-3 text-[20px]">arrow_forward</span>
    <div class="flex-1 flex flex-col gap-xs">
      <label class="text-caption text-on-surface-variant" for="time-to">To</label>
      <input
        id="time-to"
        type="time"
        class="w-full h-11 bg-surface rounded-[12px] border border-outline-variant px-md text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
        [value]="toTime()"
        (change)="setToTime($any($event.target).value)"
      />
    </div>
  </div>

  @if (hasActiveFilter()) {
    <div class="flex items-center justify-between gap-sm bg-primary-container/30 rounded-lg px-md py-xs">
      <span class="font-label-md text-label-md text-on-surface truncate">{{ activeRangeLabel() }}</span>
      <button
        type="button"
        class="shrink-0 h-7 px-sm rounded-full font-label-md text-label-md text-secondary hover:bg-secondary-container/30 transition-colors flex items-center gap-xs"
        (click)="clear()"
      >
        <span class="material-symbols-outlined text-[16px]">close</span>
        Clear
      </button>
    </div>
  }
</div>
