<div class="bg-surface-container-lowest rounded-[12px] p-md shadow-[0px_4px_12px_rgba(20,33,61,0.08)]">
  <h3 class="font-label-md text-label-md text-on-surface uppercase tracking-widest mb-md">Filter by Time</h3>
  <div class="flex items-center gap-sm">
    <div class="flex-1 flex flex-col gap-xs">
      <label class="text-caption text-on-surface-variant" for="time-from">From</label>
      <input
        id="time-from"
        type="time"
        class="w-full bg-surface rounded-[12px] border border-outline-variant px-md py-sm text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
        [value]="fromTime()"
        (change)="setFromTime($any($event.target).value)"
      />
    </div>
    <div class="flex-1 flex flex-col gap-xs">
      <label class="text-caption text-on-surface-variant" for="time-to">To</label>
      <input
        id="time-to"
        type="time"
        class="w-full bg-surface rounded-[12px] border border-outline-variant px-md py-sm text-body-md font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
        [value]="toTime()"
        (change)="setToTime($any($event.target).value)"
      />
    </div>
  </div>
</div>
